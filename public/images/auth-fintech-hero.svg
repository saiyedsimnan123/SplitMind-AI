<svg width="640" height="440" viewBox="0 0 640 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="authHeroTitle authHeroDesc">
  <title id="authHeroTitle">SplitMind AI Group Financial Coordination</title>
  <desc id="authHeroDesc">Visualizing shared group budgets, SmartSplit settlement paths, and verified proof-backed expense tracking.</desc>
  <defs>
    <linearGradient id="cardGrad1" x1="60" y1="50" x2="520" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#172A4D"/>
      <stop offset="100%" stop-color="#0E1B34"/>
    </linearGradient>
    <linearGradient id="tealGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="indigoPill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="softShadow" x="0" y="0" width="700" height="500" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#040B1A" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Subtle background blueprint grid -->
  <g opacity="0.14" stroke="#60A5FA" stroke-width="1">
    <path d="M40 80H600M40 140H600M40 200H600M40 260H600M40 320H600M40 380H600"/>
    <path d="M100 30V410M180 30V410M260 30V410M340 30V410M420 30V410M500 30V410M580 30V410"/>
  </g>

  <!-- Ambient radial glow circles -->
  <circle cx="485" cy="120" r="115" fill="#2563EB" opacity="0.16"/>
  <circle cx="155" cy="315" r="95" fill="#14B8A6" opacity="0.12"/>

  <!-- Main Workspace Intelligence Card -->
  <g filter="url(#softShadow)">
    <rect x="64" y="54" width="430" height="278" rx="18" fill="url(#cardGrad1)" stroke="#2C4470" stroke-width="1.5"/>
    <rect x="86" y="76" width="128" height="24" rx="12" fill="#1D3663" stroke="#3B82F6" stroke-opacity="0.4"/>
    <circle cx="100" cy="88" r="4" fill="#2DD4BF"/>
    <rect x="112" y="84" width="84" height="8" rx="4" fill="#BFDBFE" opacity="0.9"/>

    <!-- Top balance display -->
    <rect x="86" y="118" width="110" height="9" rx="4.5" fill="#94A3B8" opacity="0.55"/>
    <rect x="86" y="136" width="176" height="22" rx="6" fill="#F8FAFC" opacity="0.94"/>
    <rect x="276" y="140" width="74" height="14" rx="7" fill="#134E4A"/>
    <rect x="288" y="145" width="50" height="4" rx="2" fill="#2DD4BF"/>

    <!-- Bar chart comparing categories -->
    <rect x="86" y="182" width="246" height="122" rx="12" fill="#0B1528" stroke="#1E355B"/>
    <rect x="108" y="246" width="22" height="42" rx="5" fill="#3B82F6" opacity="0.7"/>
    <rect x="142" y="218" width="22" height="70" rx="5" fill="url(#barGrad)"/>
    <rect x="176" y="232" width="22" height="56" rx="5" fill="#6366F1" opacity="0.85"/>
    <rect x="210" y="202" width="22" height="86" rx="5" fill="#2DD4BF"/>
    <rect x="244" y="226" width="22" height="62" rx="5" fill="#3B82F6" opacity="0.85"/>
    <rect x="278" y="252" width="22" height="36" rx="5" fill="#475569"/>
    <!-- Trend curve -->
    <path d="M114 236 C150 202, 185 220, 221 194 C252 174, 276 212, 304 198" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="221" cy="194" r="5" fill="#0B1528" stroke="#2DD4BF" stroke-width="2.5"/>

    <!-- Right mini SmartSplit panel inside card -->
    <rect x="348" y="182" width="124" height="122" rx="12" fill="#0B1528" stroke="#1E355B"/>
    <rect x="362" y="198" width="70" height="8" rx="4" fill="#93C5FD" opacity="0.8"/>
    <rect x="362" y="220" width="96" height="20" rx="6" fill="#15284B"/>
    <circle cx="374" cy="230" r="5" fill="#2DD4BF"/>
    <rect x="386" y="227" width="58" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="362" y="248" width="96" height="20" rx="6" fill="#15284B"/>
    <circle cx="374" cy="258" r="5" fill="#60A5FA"/>
    <rect x="386" y="255" width="50" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="362" y="276" width="96" height="16" rx="6" fill="url(#indigoPill)"/>
  </g>

  <!-- Floating SmartSplit Settlement Pill (Top Right) -->
  <g filter="url(#softShadow)">
    <rect x="384" y="26" width="214" height="92" rx="14" fill="#FFFFFF" stroke="#DCE5F2" stroke-width="1.5"/>
    <rect x="402" y="43" width="84" height="16" rx="8" fill="#EFF6FF"/>
    <rect x="412" y="49" width="64" height="4" rx="2" fill="#2563EB"/>
    <circle cx="414" cy="84" r="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
    <path d="M436 84H478" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M472 78L480 84L472 90" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="498" cy="84" r="14" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5"/>
    <rect x="524" y="76" width="56" height="16" rx="8" fill="#0F172A"/>
    <rect x="534" y="82" width="36" height="4" rx="2" fill="#2DD4BF"/>
  </g>

  <!-- Floating Proof & Security Card (Bottom Right) -->
  <g filter="url(#softShadow)">
    <rect x="348" y="286" width="236" height="114" rx="14" fill="#FFFFFF" stroke="#DCE5F2" stroke-width="1.5"/>
    <rect x="366" y="306" width="38" height="38" rx="10" fill="#ECFDFB" stroke="#99F6E4"/>
    <path d="M385 315L395 319V326C395 332 390.5 336.5 385 338C379.5 336.5 375 332 375 326V319L385 315Z" fill="#0D9488" opacity="0.2" stroke="#0D9488" stroke-width="1.8"/>
    <path d="M380.5 326L383.8 329.2L390 322.8" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="416" y="310" width="128" height="10" rx="5" fill="#0F172A"/>
    <rect x="416" y="328" width="96" height="7" rx="3.5" fill="#64748B" opacity="0.6"/>
    <rect x="366" y="362" width="200" height="20" rx="8" fill="#F1F5F9"/>
    <rect x="376" y="369" width="76" height="6" rx="3" fill="#2563EB"/>
    <rect x="514" y="369" width="42" height="6" rx="3" fill="#0D9488"/>
  </g>

  <!-- Floating Group Roster Nodes (Bottom Left) -->
  <g filter="url(#softShadow)">
    <rect x="36" y="302" width="222" height="96" rx="14" fill="#132343" stroke="#2D4A7C" stroke-width="1.5"/>
    <circle cx="68" cy="336" r="14" fill="#3B82F6"/>
    <circle cx="88" cy="336" r="14" fill="#6366F1" stroke="#132343" stroke-width="2"/>
    <circle cx="108" cy="336" r="14" fill="#14B8A6" stroke="#132343" stroke-width="2"/>
    <circle cx="128" cy="336" r="14" fill="#1E3A8A" stroke="#132343" stroke-width="2"/>
    <rect x="156" y="328" width="82" height="16" rx="8" fill="#1D3663"/>
    <rect x="166" y="334" width="62" height="4" rx="2" fill="#93C5FD"/>
    <rect x="54" y="366" width="184" height="12" rx="6" fill="#0B1528"/>
    <rect x="54" y="366" width="126" height="12" rx="6" fill="url(#tealGlow)"/>
  </g>
</svg>
